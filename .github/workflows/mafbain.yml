name: Diagnose task_mmu SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: HaavkReborn
          fetch-depth: 0

      - name: Inspect task_mmu
        shell: bash
        run: |
          set -euo pipefail

          FILE="fs/proc/task_mmu.c"

          echo "=== Function definitions ==="
          grep -nE \
            '^[[:space:]]*static int (show_smap|show_smaps_rollup|show_pid_smap|show_tid_smap)\(' \
            "$FILE" || true

          echo "=== Conflict markers ==="
          grep -nE \
            '^(<<<<<<<|=======|>>>>>>>)' "$FILE" || true

          echo "=== Code around first error ==="
          sed -n '880,1010p' "$FILE"

          echo "=== Code around second error ==="
          sed -n '1010,1070p' "$FILE"

          echo "=== Recent changes ==="
          git log -5 --oneline -- fs/proc/task_mmu.c

          echo "=== Working tree diff ==="
          git diff --check
          git diff -- fs/proc/task_mmu.c
