name: Fix SUSFS task_mmu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-task-mmu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: HaavkReborn
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect duplicate functions
        shell: bash
        run: |
          set -euo pipefail

          FILE="fs/proc/task_mmu.c"

          echo "=== Definisi show_smap ==="
          grep -nE '^[[:space:]]*static int show_smap\(' "$FILE" || true

          COUNT=$(grep -Ec '^[[:space:]]*static int show_smap\(' "$FILE" || true)

          if [ "$COUNT" -le 1 ]; then
            echo "Tidak ditemukan duplikasi show_smap."
            exit 0
          fi

          echo "::warning::Ditemukan $COUNT definisi show_smap."
          echo "=== Potongan kode yang perlu diperiksa ==="
          sed -n '820,960p' "$FILE"

      - name: Show SUSFS changes
        run: |
          git diff -- fs/proc/task_mmu.c
          git log -5 --oneline -- fs/proc/task_mmu.c

      - name: Summary
        if: always()
        run: |
          echo "Pemeriksaan selesai. Tidak ada perubahan source otomatis." \
            >> "$GITHUB_STEP_SUMMARY"
