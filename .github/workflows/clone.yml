name: Create HaavkSukisu Branch

on:
  workflow_dispatch:

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: HaavkSukisu   # ganti jika sumbernya branch lain (misal: 16)

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch HaavkSukisu
        run: |
          git checkout -b HaavkSukisuT

      - name: Push branch to origin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HaavkSukisuT
