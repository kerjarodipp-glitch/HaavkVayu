name: Create HaavkSukisu Branch

on:
  workflow_dispatch:

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: HaavkKSU   # ganti sesuai branch sumber

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch HaavkOverclock
        run: |
          git checkout -b HaavkOverclock

      - name: Push branch to origin using PAT
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}  # simpan PAT di secrets
        run: |
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HaavkOverclock
