name: SUSFS v2.3.0 Backport to Vayu

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "URL repository kernel vayu"
        required: true
        type: string
      branch:
        description: "Branch kernel vayu"
        required: true
        type: string
      defconfig:
        description: "Path defconfig relatif dari root kernel"
        required: true
        default: "arch/arm64/configs/vayu_user_defconfig"
        type: string

permissions:
  contents: read

jobs:
  backport:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone Vayu Kernel
        env:
          TOKEN: ${{ secrets.CLONE_PAT }}
          REPO: ${{ inputs.repo_url }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [[ "$REPO" != https://github.com/* ]]; then
            echo "Gunakan URL repository HTTPS GitHub."
            exit 1
          fi

          if [[ -n "${TOKEN:-}" ]]; then
            AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w 0)
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
              clone --single-branch --branch "$BRANCH" \
              "$REPO" kernel
            unset AUTH TOKEN
          else
            git clone --single-branch --branch "$BRANCH" \
              "$REPO" kernel
          fi

          git -C kernel rev-parse HEAD \
            > original-commit.txt

      - name: Download SUSFS Patch
        run: |
          set -euo pipefail

          URL="https://github.com/manipvlator/los_kernel_xiaomi_sm6150/commit/0ab7e57f96849fd61cf14e56e350bba1e87ebf64.patch"

          curl --fail --location --retry 3 \
            "$URL" -o susfs.patch

          test -s susfs.patch
          grep -q '^diff --git ' susfs.patch

      - name: Verify Source Commit
        run: |
          set -euo pipefail

          git init source-check
          git -C source-check remote add origin \
            https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git

          git -C source-check fetch --depth=1 origin \
            0ab7e57f96849fd61cf14e56e350bba1e87ebf64

          git -C source-check cat-file -e \
            '0ab7e57f96849fd61cf14e56e350bba1e87ebf64^{commit}'

      - name: Validate Vayu Defconfig
        id: config
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail

          case "$DEFCONFIG" in
            /*|*..*)
              echo "Path defconfig tidak valid."
              exit 1
              ;;
          esac

          if [[ "$DEFCONFIG" != arch/arm64/configs/* ]]; then
            DEFCONFIG="arch/arm64/configs/$DEFCONFIG"
          fi

          if [[ ! -f "kernel/$DEFCONFIG" ]]; then
            echo "Defconfig tidak ditemukan: $DEFCONFIG"
            find kernel/arch/arm64/configs \
              -iname '*vayu*' -o -iname '*user*'
            exit 1
          fi

          echo "path=$DEFCONFIG" >> "$GITHUB_OUTPUT"
          echo "Defconfig target: $DEFCONFIG"

      - name: Apply SUSFS Backport
        id: patch
        continue-on-error: true
        run: |
          set -uo pipefail

          cd kernel

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Simpan baseline sebelum backport.
          git rev-parse HEAD > ../original-commit.txt

          # Jangan menerapkan konfigurasi khusus sweet.
          # --reject menerapkan hunk yang cocok dan menyimpan
          # hunk yang gagal ke file .rej.
          git apply --reject \
            --exclude='arch/arm64/configs/*sweet*' \
            ../susfs.patch \
            > ../apply.log 2>&1

          RC=$?
          echo "apply_exit_code=$RC" >> "$GITHUB_OUTPUT"

          cat ../apply.log || true

          # Konflik tidak menghentikan pengumpulan laporan.
          exit 0

      - name: Generate Conflict and Safety Report
        if: always()
        env:
          DEFCONFIG: ${{ steps.config.outputs.path }}
        run: |
          set +e
          mkdir -p output/conflicts output/review

          cp apply.log output/apply.log 2>/dev/null || true
          cp susfs.patch output/upstream.patch 2>/dev/null || true
          cp original-commit.txt output/ 2>/dev/null || true

          if [[ ! -d kernel/.git ]]; then
            echo "Clone kernel gagal." > output/result.txt
            exit 0
          fi

          git -C kernel status --short \
            > output/git-status.txt

          git -C kernel diff --check \
            > output/diff-check.txt 2>&1

          git -C kernel diff --binary \
            > output/vayu-susfs-backport.patch

          git -C kernel diff --name-only \
            > output/modified-files.txt

          # Daftar file yang memiliki hunk ditolak.
          find kernel -type f -name '*.rej' -print \
            | sort > output/conflict-files.txt

          # Simpan semua file reject dengan struktur direktori.
          while IFS= read -r rej; do
            [[ -z "$rej" ]] && continue

            rel="${rej#kernel/}"
            target="${rel%.rej}"

            mkdir -p "output/conflicts/$(dirname "$rel")"
            cp "$rej" "output/conflicts/$rel"

            review="output/review/${target}.review.txt"
            mkdir -p "$(dirname "$review")"

            {
              echo "FILE: $target"
              echo
              echo "<<<<<<< VAYU_ORIGINAL"
              git -C kernel show "HEAD:$target" 2>/dev/null \
                || echo "[Original file unavailable]"
              echo "======="
              echo "SUSFS_BACKPORT_REJECTED_HUNKS"
              cat "$rej"
              echo ">>>>>>> END_REVIEW"
            } > "$review"
          done < output/conflict-files.txt

          # Klasifikasi file yang disentuh oleh patch.
          # File tanpa .rej hanya berarti diterapkan secara tekstual.
          {
            echo "=== PATCH REVIEW ==="
            echo
            echo "Commit sumber: 0ab7e57f96849fd61cf14e56e350bba1e87ebf64"
            echo "Target: kernel vayu"
            echo
            echo "=== FILE CONFLICT ==="

            if [[ -s output/conflict-files.txt ]]; then
              cat output/conflict-files.txt
            else
              echo "Tidak ada file .rej."
            fi

            echo
            echo "=== FILE BERUBAH ==="
            cat output/modified-files.txt

            echo
            echo "=== STATUS GIT ==="
            cat output/git-status.txt

            echo
            echo "=== INTERPRETASI ==="
            echo "File .rej: hunk perlu diperbaiki manual."
            echo "File yang diterapkan tanpa .rej: belum terbukti kompatibel."
            echo "File baru mungkin muncul sebagai untracked."
            echo "Tidak ada file yang dinyatakan aman untuk flash."
            echo
            echo "Defconfig target: ${DEFCONFIG:-not validated}"
            echo "Defconfig sweet dikecualikan dari patch."
          } > output/backport-report.txt

          if [[ -s output/conflict-files.txt ]]; then
            echo "PARTIAL: konflik ditemukan; perbaikan manual diperlukan." \
              > output/result.txt
          else
            echo "REVIEW: tidak ada .rej; verifikasi kode tetap diperlukan." \
              > output/result.txt
          fi

      - name: Upload Backport Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vayu-susfs-v2.3.0-review
          path: output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
