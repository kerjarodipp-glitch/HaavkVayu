name: Backport SUSFS v2.3.0 to Vayu

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "URL source kernel vayu"
        required: true
        type: string
      branch:
        description: "Branch kernel vayu"
        required: true
        type: string
      defconfig:
        description: "Nama file defconfig vayu"
        required: true
        default: "vayu_user_defconfig"
        type: string

permissions:
  contents: read

jobs:
  backport:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Vayu Kernel
        env:
          TOKEN: ${{ secrets.CLONE_PAT }}
          REPO: ${{ inputs.repo_url }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [ -n "${TOKEN:-}" ]; then
            AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w 0)

            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
              clone --single-branch --branch "$BRANCH" \
              "$REPO" kernel

            unset AUTH TOKEN
          else
            git clone --single-branch --branch "$BRANCH" \
              "$REPO" kernel
          fi

      - name: Download SUSFS Commit
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/manipvlator/los_kernel_xiaomi_sm6150/commit/0ab7e57f96849fd61cf14e56e350bba1e87ebf64.patch" \
            -o susfs.patch

          test -s susfs.patch

      - name: Fetch Source Commit
        run: |
          set -euo pipefail

          git -C kernel fetch \
            https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git \
            0ab7e57f96849fd61cf14e56e350bba1e87ebf64

          git -C kernel cat-file -t \
            0ab7e57f96849fd61cf14e56e350bba1e87ebf64

      - name: Apply Backport
        id: patch
        continue-on-error: true
        run: |
          set -uo pipefail
          cd kernel

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git apply --3way --reject \
            --exclude='arch/arm64/configs/*sweet*' \
            ../susfs.patch 2>&1 | tee ../apply.log

          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Configure Vayu Defconfig
        if: steps.patch.outcome == 'success'
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          cd kernel

          CONFIG="arch/arm64/configs/$DEFCONFIG"

          if [ ! -f "$CONFIG" ]; then
            echo "Defconfig tidak ditemukan: $CONFIG"
            find arch/arm64/configs -iname '*vayu*' -o -iname '*user*'
            exit 1
          fi

          echo "Defconfig ditemukan: $CONFIG"
          echo "Tidak mengubah opsi KernelSU/SUSFS secara paksa."
          echo "Periksa konfigurasi SUSFS yang dibutuhkan oleh source ini."

      - name: Generate Backport Results
        if: always()
        run: |
          set +e
          mkdir -p output

          if [ -d kernel/.git ]; then
            git -C kernel diff --binary \
              > output/vayu-susfs-backport.patch

            git -C kernel status --short \
              > output/status.txt

            find kernel -type f -name '*.rej' \
              -exec cp --parents {} output/ \;
          fi

          if [ -f apply.log ]; then
            cp apply.log output/apply.log
          fi

          if [ -f susfs.patch ]; then
            cp susfs.patch output/upstream.patch
          fi

          if [ "${{ steps.patch.outcome }}" = "success" ]; then
            echo "Patch application: SUCCESS" > output/result.txt
          else
            echo "Patch application: FAILED - inspect apply.log and .rej files" \
              > output/result.txt
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vayu-susfs-backport
          path: output/
          if-no-files-found: warn
          retention-days: 3
