name: Backport SuSFS v2.0.0

on:
  workflow_dispatch:

jobs:
  backport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu semua riwayat untuk cherry-pick

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add source remote (kylieeXD surya)
        run: |
          git remote add susfs-src https://github.com/manipvlator/los_kernel_xiaomi_sm6150
          git fetch susfs-src

      - name: Try to cherry-pick SuSFS commit
        id: cherry
        run: |
          set -e
          git cherry-pick 0ab7e57f96849fd61cf14e56e350bba1e87ebf64 || echo "conflict" > .conflict

      - name: Handle conflicts if any
        if: ${{ hashFiles('.conflict') != '' }}
        run: |
          echo "::warning::Cherry-pick caused conflicts, keeping partial patch"
          git status
          git add .
          git commit -m "Conflict Fix Needed"

      - name: Push backport branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HaavkReborn

      - name: Show summary
        run: |
          echo "If there were conflicts, please resolve manually in your repo."
