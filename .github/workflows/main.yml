name: Build Kernel (4.14 - crDroid)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"
  push:
    branches:
      - HEAD
  pull_request:
    branches:
      - HEAD

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "vayu_user_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 100

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies & toolchain
        run: |
          set -euo pipefail

          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            aria2 binutils make python3 libssl-dev build-essential \
            bc bison flex unzip ca-certificates xz-utils \
            cpio device-tree-compiler git git-lfs curl wget \
            libelf-dev dwarves

          # Python 2 is optional; do not substitute Python 3 blindly.
          if ! command -v python2 >/dev/null 2>&1; then
            sudo apt-get install -y python2 || true
          fi

          # Toolchain
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            google-clang

          # Replace mkdtboimg.py with AOSP version
          MKDTBO_PATH="scripts/dtc/libfdt/mkdtboimg.py"
          mkdir -p "$(dirname "$MKDTBO_PATH")"

          curl -fL \
            "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
            | base64 --decode > "$MKDTBO_PATH"

          chmod +x "$MKDTBO_PATH"

          curl -fLSs \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" \
            | bash -s main

      - name: Fix legacy IDA API for kernel 4.14
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          replacements = {
              "fs/super.c": [
                  (
                      r"ida_alloc_range\(&unnamed_dev_ida,\s*"
                      r"DEFAULT_KSU_MNT_MINOR_DEV,\s*"
                      r"\(1\s*<<\s*MINORBITS\)\s*-\s*1,\s*GFP_ATOMIC\)",
                      "ida_simple_get(&unnamed_dev_ida, "
                      "DEFAULT_KSU_MNT_MINOR_DEV, "
                      "(1 << MINORBITS), GFP_ATOMIC)"
                  ),
              ],
              "fs/namespace.c": [
                  (
                      r"ida_alloc_min\(&mnt_group_ida,\s*"
                      r"DEFAULT_KSU_MNT_GROUP_ID,\s*GFP_KERNEL\)",
                      "ida_simple_get(&mnt_group_ida, "
                      "DEFAULT_KSU_MNT_GROUP_ID, 0, GFP_KERNEL)"
                  ),
                  (
                      r"ida_alloc_min\(&mnt_group_ida,\s*1,\s*GFP_KERNEL\)",
                      "ida_simple_get(&mnt_group_ida, 1, 0, GFP_KERNEL)"
                  ),
                  (
                      r"ida_alloc_min\(&mnt_id_ida,\s*"
                      r"DEFAULT_KSU_MNT_ID,\s*GFP_KERNEL\)",
                      "ida_simple_get(&mnt_id_ida, "
                      "DEFAULT_KSU_MNT_ID, 0, GFP_KERNEL)"
                  ),
              ],
          }

          for filename, rules in replacements.items():
              path = Path(filename)
              if not path.is_file():
                  print(f"SKIP: {filename} tidak ditemukan")
                  continue

              text = path.read_text()
              original = text

              for pattern, replacement in rules:
                  text, count = re.subn(pattern, replacement, text)
                  print(f"{filename}: pola diganti {count} kali")

              if text != original:
                  path.write_text(text)

          # Fail early if the specific unsupported calls remain.
          for filename in ("fs/super.c", "fs/namespace.c"):
              path = Path(filename)
              if not path.exists():
                  continue

              text = path.read_text()
              if re.search(r"\bida_alloc_(?:range|min)\s*\(", text):
                  sys.exit(
                      f"ERROR: API IDA baru masih ditemukan di {filename}. "
                      "Pola source berbeda; hentikan sebelum compile."
                  )

          print("Pemeriksaan API IDA selesai.")
          PY

          git diff --check
          git diff -- fs/super.c fs/namespace.c

      - name: GetTime
        id: get_time
        run: echo "TIME=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build Kernel-With-KernelSU
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$(pwd)/google-clang/bin:$PATH"
          export LD=ld.lld

          echo ">>> Starting defconfig build..."
          set -o pipefail
          make $KERNEL_CMDLINE "$KERNEL_DEFCONFIG" \
            CC="ccache clang" 2>&1 | tee build_defconfig.log

          echo ">>> Starting kernel compilation (Image + dtbo.img)..."
          make $KERNEL_CMDLINE CC="ccache clang" \
            -j"$(nproc)" Image dtbo.img 2>&1 | tee build_kernel.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Logs-${{ steps.get_time.outputs.TIME }}
          if-no-files-found: warn
          path: |
            build_defconfig.log
            build_kernel.log
            out/arch/arm64/boot/.config

      - name: Upload Raw Outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Raw_Kernel-${{ steps.get_time.outputs.TIME }}
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
